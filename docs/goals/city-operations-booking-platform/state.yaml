version: 2

goal:
  title: "Benefitsi City Operations & Booking Platform"
  slug: "city-operations-booking-platform"
  kind: existing_plan
  tranche: "Complete successive safe verified vertical slices until the global city review, geo hierarchy, Stripe Connect test booking, and guarded automation oracle is satisfied."
  status: active
  oracle:
    signal: "End-to-end local/test-mode walkthrough of review, geo aggregation, connected provider onboarding, offer publication, booking, idempotent webhook handling, inventory, audit, and guarded agent automation."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed automated tests, production build, migration verification, Stripe test-mode webhook replay test, and browser walkthrough mapped to the owner outcome."
  intake:
    original_request: "Build the proposed dashboard, region model, and Benefitsi-owned automated booking service with Stripe and agent support."
    interpreted_outcome: "Benefitsi operates one safe automated platform for reviewing all city content and selling local experiences through its own Stripe-backed booking flow."
    input_shape: existing_plan
    audience: "Benefitsi admins, providers, residents, visitors, and city agents"
    authority: requested
    proof_type: demo
    completion_proof: "The full oracle walkthrough succeeds in test mode and all goal-owned tests/build checks pass."
    likely_misfire: "A polished dashboard or Checkout link that omits review evidence, regional relationships, inventory concurrency, webhook idempotency, audit, provider operations, or authority gates."
    blind_spots_considered:
      - "Merchant-of-record, tax, terms, refund, cancellation, payout, and chargeback ownership"
      - "Stripe Connect account and charge model"
      - "Inventory overselling and webhook replay"
      - "PII, secret, KYC, RLS, authorization, and audit boundaries"
      - "Regional SEO duplication and canonical URLs"
      - "Agent permissions and human approval gates"
      - "Existing dirty worktree"
    existing_plan_facts:
      - "Global review dashboard comes first."
      - "Use hierarchical and many-to-many regional relationships."
      - "Roll out Annweiler, then Landau and surroundings, then regional hubs."
      - "Benefitsi owns the customer booking experience."
      - "Stripe integration is test-mode-first."
      - "Agents support research and operations but cannot perform sensitive final actions."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: active
    url: "http://goalbuddy.localhost:41737/city-operations-booking-platform/"
    command: "node /Users/patrick/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/city-operations-booking-platform"

