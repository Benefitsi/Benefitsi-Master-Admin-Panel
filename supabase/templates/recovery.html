<h2>Reset your Benefitsi password</h2>

<p>We received a request to reset your password.</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}">
    Choose a new password
  </a>
</p>

<p>This link expires shortly and can only be used once. If you did not request it, you can safely ignore this email.</p>
