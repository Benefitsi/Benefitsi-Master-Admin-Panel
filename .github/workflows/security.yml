name: Security and quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan repository and Git history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose

  application-checks:
    name: Dependencies, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies and verify source mitigation
        run: npm run audit

      - name: Preserve full unchanged dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.run_id }}
          path: work/dependency-audit/npm-audit-raw.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: npm run lint

      # The cross-repository suite also requires a separate Benefitsi web checkout.
      # Keep these load, publication and authorization regressions self-contained.
      - name: Partner data and authorization regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/admin-dashboard-loading.test.mjs
          tests/partner-microsite-preview-access.test.mjs
          tests/microsite-publication-cache.test.mjs
          tests/partner-capability-policy.test.mjs

      - name: Login and authorization regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/login-page-session.test.mjs
          tests/login-service-failure.test.mjs
          tests/portal-proxy.test.mjs
          tests/portal-login-security.test.mjs
          tests/commerce-session-boundary.test.mjs
          tests/portal-routing.test.mjs

      - name: Type-check
        run: npm exec -- tsc --noEmit

      - name: Build
        run: npm run build
