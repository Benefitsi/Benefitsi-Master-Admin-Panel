name: Security and quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan repository and Git history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose

  application-checks:
    name: Dependencies, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies and verify source mitigation
        run: npm run audit

      - name: Preserve full unchanged dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}
          path: work/dependency-audit/npm-audit-raw.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: npm run lint

      # The cross-repository suite also requires a separate Benefitsi web checkout.
      # Keep these load, publication and authorization regressions self-contained.
      - name: Partner data and authorization regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/admin-dashboard-loading.test.mjs
          tests/admin-microsite-loading.test.mjs
          tests/partner-microsite-preview-access.test.mjs
          tests/microsite-publication-cache.test.mjs
          tests/public-microsite-contract.test.mjs
          tests/partner-capability-policy.test.mjs
          tests/partner-plan-actions.test.mjs
          tests/partner-onboarding-ui.test.mjs
          tests/partner-dashboard-contract.test.mjs
          tests/partner-dashboard-ui.test.mjs
          tests/partner-chart-data.test.mjs
          tests/partner-dashboard-csv.test.mjs
          tests/partner-dashboard-insights.test.mjs
          tests/partner-dashboard-rich-ui.test.mjs

      - name: Partner visit-level reference, data boundaries and App contract
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/partner-visit-levels.test.mjs
          tests/partner-visit-level-data.test.mjs
          tests/partner-visit-level-page.test.mjs

      - name: Login and authorization regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/login-page-session.test.mjs
          tests/login-service-failure.test.mjs
          tests/portal-proxy.test.mjs
          tests/portal-login-security.test.mjs
          tests/commerce-session-boundary.test.mjs
          tests/portal-routing.test.mjs

      - name: Admin navigation, dashboard streaming and source boundaries
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/admin-navigation.test.mjs
          tests/admin-navigation-ui.test.mjs
          tests/ecosystem-streaming.test.mjs
          tests/admin-language-hydration.test.mjs
          tests/ecosystem-overview.test.mjs
          tests/ecosystem-directory.test.mjs
          tests/ecosystem-analytics.test.mjs
          tests/ecosystem-search.test.mjs
          tests/ecosystem-search-ui.test.mjs
          tests/agent-summaries.test.mjs
          tests/founder-overview-data.test.mjs
          tests/agent-control-data.test.mjs

      - name: Benefit form and dialog regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/form-save-ui.test.mjs
          tests/partner-management-regressions.test.mjs
          tests/menu-ai-dialog.test.mjs

      - name: Partner configuration and microsite editor regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/benefit-taxonomy.test.mjs
          tests/deal-audience.test.mjs
          tests/deal-order.test.mjs
          tests/deal-save-action.test.mjs
          tests/deal-editor-behavior.test.mjs
          tests/milestone-save.test.mjs
          tests/partner-configuration-actions.test.mjs
          tests/partner-internal-tools.test.mjs
          tests/partner-upload-optimization.test.mjs
          tests/microsite-workflow.test.mjs
          tests/microsite-editor-behavior.test.mjs
          tests/microsite-image-upload.test.mjs
          tests/microsite-upload-actions.test.mjs
          tests/microsite-responsive.test.mjs
          tests/microsite-public-action-forms.test.mjs
          tests/microsite-publication-labels.test.mjs

      - name: Menu video upload, ownership and retry regression tests
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/menu-video.test.mjs
          tests/menu-video-storage.test.mjs
          tests/menu-video-actions.test.mjs
          tests/menu-item-video-field.test.mjs
          tests/menu-item-video-form.test.mjs

      - name: Type-check
        run: npm exec -- tsc --noEmit

      - name: Internal workspace and partner conversation regression tests
        run: node --import tsx --test --test-concurrency=2 tests/workspace-*.test.mjs

      - name: City memory administration and publication regression tests
        run: node --import tsx --test --test-concurrency=2 tests/city-memory-stamps.test.mjs tests/city-memory-map.test.mjs tests/city-memory-map-ui.test.mjs tests/city-memory-place-centers.test.mjs tests/city-memory-polygon.test.mjs tests/community-public-revalidation.test.mjs

      - name: Build
        run: npm run build
